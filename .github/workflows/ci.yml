name: PRISM-Edge CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy reportlab

      - name: Run Full 7-Pillar Test Suite
        run: |
          python tests/test_prism_suite.py

      - name: Test Server Boot & Endpoint Health
        run: |
          python api_server/server.py 8080 &
          SERVER_PID=$!
          sleep 3
          python -c "import urllib.request; resp = urllib.request.urlopen('http://localhost:8080/api/health'); assert resp.status == 200"
          kill $SERVER_PID
